<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logicat - {% block titulo %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-dashboard">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>Logicat</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="/home" class="nav-item {% block active_home %}{% endblock %}">🏠 Home</a>
            <a href="/analises" class="nav-item {% block active_analises %}{% endblock %}">📊 Análises</a>
            <a href="/graficos" class="nav-item {% block active_graficos %}{% endblock %}">📈 Gráficos</a>
        </nav>
    </aside>

    <main class="main-content">
        {% block conteudo %}
        {% endblock %}
    </main>

</body>
</html>
